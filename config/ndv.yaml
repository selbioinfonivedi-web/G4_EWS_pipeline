# G4-WATCH pathogen configuration — Newcastle Disease Virus
#
# Provisioned 2026-09-13. Every value below was read from the record it
# claims to come from, not inferred.

pathogen: NDV
display_name: "Newcastle Disease Virus"
genome_type: ssRNA_negative
taxonomy_id: 11191
provisioned: true

reference:
  accession: NC_075404.1
  fasta: data/reference_genomes/ndv/NC_075404.1.fasta
  genome_length: 15186
  # NDV is a mononegavirus: six CDS features (NP, P, M, F, HN, L) rather
  # than one polyprotein. GenomeAnnotation models a single span, so these
  # bounds are the CODING REGION AS A WHOLE — first CDS start (122) to
  # last CDS end (14995), from NC_075404.1's own feature table.
  #
  # Meaningful rather than a fudge: the 3' leader (1-121) and 5' trailer
  # (14996-15186) are the genuine non-coding regulatory regions, which is
  # what the UTR labels are for. What it does NOT give is per-gene
  # labelling — a locus in the coding region is "CDS", not "inside F".
  # That needs GenomeAnnotation extended to a list of ORF spans (the same
  # work LSDV needs; revision log R-08).
  cds_start: 122
  cds_end: 14995

corpus:
  metadata_tsv: data/reference_genomes/ndv/corpus/ndv_corpus_metadata.tsv
  sequences_fasta: data/reference_genomes/ndv/corpus/ndv_corpus_sequences.fasta
  # NOT genotype: every record in this corpus has an EMPTY /genotype
  # qualifier. NDV genotypes are assigned in the literature from
  # specific genes and are not recorded in the GenBank source features, so
  # declaring genotype here would resolve every sequence to "unknown" and
  # fail the Appendix C per-lineage floor for a reason about metadata
  # rather than about the virus.
  #
  # Country is used instead, as for EBV and PPRV. Sub-national detail is
  # stripped at acquisition ("Japan:Gifu,Seki" -> "Japan"), because
  # otherwise one country splits into many false lineages and each split
  # pushes real groups under the per-lineage floor. Country is NOT a
  # phylogenetic lineage and nothing here pretends it is.
  lineage_field: country
  lineage_fallback_fields: []
  exclude_lineages: []

qc:
  min_completeness_fraction: 0.90
  max_n_content_fraction: 0.05
  require_year_precision_date: true

alignment:
  tool: mafft
  args: "--auto --keeplength --addfragments"
  max_gapped_fraction: 0.50

recombination:
  enabled: true
  tier: standard
  alpha: 0.05

phylogenetics:
  tool: iqtree2
  model: GTR+F+I+G4
  # REDUCED from the architecture's 1000, deliberately and with sign-off,
  # for the multi-pathogen APPLICATION validation. 200 replicates give
  # usable support at a fraction of the runtime; FMDV, the scientific
  # headline pathogen, stays at 1000. Any published NDV tree must be
  # rebuilt at 1000 first.
  bootstrap_replicates: 200
  seed: 20250823
  outgroup: null
  ancestral_states: required
  timetree:
    tool: treetime
    clock_rate: null
    clock_filter_iqd: 3.0

g4_prediction:
  g4hunter:
    window: 25
    threshold: 1.2
  pattern_motif:
    enabled: true
  g4rna_screener:
    enabled: false
    reason: "Python 2-only with a pickled PyBrain classifier; see vendor/README.md"
  pqsfinder:
    enabled: false
    reason: "DNA-virus-scoped tool, deferred"
  concordance:
    min_overlap_fraction: 0.80
  flank: 100

control_regions:
  length_tolerance: 0.10
  gc_tolerance: 0.05
  pqs_overlap_score_threshold: 0.80
  exclusion_buffer: 50
  n_controls: 5

atlas:
  version: "1.0"
  path: data/atlases/G4_Reference_Atlas_v1.0.ndv.tsv

dh1_gate:
  alpha: 0.05
  ledger: data/atlases/testing_ledger.tsv

detection:
  baseline_fraction: 0.5
  min_baseline_windows: 8

# Layer 1 of the Section 12 gate. False until a SUPPORTED D.H1 verdict
# exists for this pathogen, which no run has produced.
operational_mode: false
