# Reverse proxy for the G4-WATCH read-only service.
#
# This is the ONLY component of G4-WATCH that may face a network. The
# operator console (web.runner) executes pipeline stages as subprocesses
# and has no authentication; it binds 127.0.0.1 and must never appear
# upstream of this or any other proxy.

upstream g4watch_backend {
    server web-backend:8000;
}

# Rate limiting. Two zones because the two things being protected are
# different: /login guards a password, everything else guards the service.
#
# 5r/m on login is deliberately low. There is nothing a human does at a
# login form that needs more, and it is the only endpoint where an
# attacker's throughput translates directly into guesses per second.
limit_req_zone $binary_remote_addr zone=g4_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=g4_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=g4_conn:10m;

# ── HTTP: redirect only ─────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ACME renewal must stay reachable over plain HTTP or the certificate
    # cannot be renewed, which is a self-inflicted outage.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Supply these at deploy time; see docs/deployment.md. The container
    # will not start without them, which is intentional: a proxy that
    # silently fell back to plain HTTP would defeat the Secure flag on
    # the session cookie and transmit it in clear.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;   # the client's order is better informed
    ssl_session_cache   shared:g4ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS. Start WITHOUT preload and with a short max-age while verifying
    # the certificate chain; raise it once renewal is proven, because a
    # preload entry is effectively irreversible for the domain.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The dashboard is linked from NADRES rather than embedded in it
    # (Section 17). SAMEORIGIN allows a future same-origin iframe without
    # opening the page to arbitrary framing.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # No inline script is used by the read-only service, so the policy can
    # be strict. It is NOT applied to the workstation, which draws its
    # visualisations from a bundled script.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'" always;

    server_tokens off;          # do not advertise the nginx version
    client_max_body_size 1m;    # nothing is uploaded to a read-only service
    limit_conn g4_conn 20;

    location = /login {
        limit_req zone=g4_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://g4watch_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        limit_req zone=g4_general burst=60 nodelay;
        proxy_pass http://g4watch_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location /health {
        proxy_pass http://g4watch_backend;
        access_log off;         # a health check every few seconds is noise
    }

    location / {
        limit_req zone=g4_general burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://g4watch_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
