# Reverse proxy for the G4-WATCH dashboard.
#
# The app is read-only and stateless, so this does no session handling.
# It terminates client connections, serves static assets, and forwards
# everything else to the backend.

upstream g4watch_backend {
    server web-backend:8000;
}

server {
    listen 80;
    server_name _;

    # The dashboard is linked from NADRES rather than embedded in it
    # (Section 17). SAMEORIGIN allows a future iframe embed from the same
    # origin without opening the page to arbitrary framing.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 1m;   # nothing is uploaded; this is a read-only service

    location /static/ {
        proxy_pass http://g4watch_backend;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location /health {
        proxy_pass http://g4watch_backend;
        access_log off;
    }

    location / {
        proxy_pass http://g4watch_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
