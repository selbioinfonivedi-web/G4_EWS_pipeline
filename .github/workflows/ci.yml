name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Ancestral-state reconstruction shells out to Rscript + ape. It is a
      # required Stage 2/4 output, not an optional extra, so CI installs it
      # rather than letting those tests skip silently.
      - name: Install R and ape
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-cran-ape

      - name: Build PhiPack at its pinned commit
        run: make vendor

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" fastapi uvicorn httpx

      - name: Environment report
        run: g4watch doctor || true

      - name: Validate every pathogen config
        run: g4watch config validate

      # The coverage gate is set in pyproject.toml (fail_under = 85) and is
      # enforced here, not advisory.
      - name: Tests with coverage gate
        run: pytest --cov=g4watch --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check g4watch tests web

  non-circularity:
    name: ground-truth non-circularity lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint passes on the real tree
        run: pytest tests/lint -q

      # Sprint 0's definition of done: the lint must demonstrably FAIL on a
      # deliberately-circular test file. A lint that has never been seen to
      # fail is not known to work.
      - name: Lint fails on a deliberately-circular file
        run: |
          cat > tests/ground_truth/test_deliberately_circular.py <<'EOF'
          """Deliberately circular fixture. Independent of nothing.

          CI writes this file, asserts the lint rejects it, and deletes it.
          It must never be committed.
          """
          import numpy as np
          from g4watch.metrics.normalization import z_against_baseline

          def simulate_truth():
              # Circular: the expected value is produced by the code under test.
              return z_against_baseline(1.0, [1.0, 2.0, 3.0])
          EOF
          if pytest tests/lint -q > /dev/null 2>&1; then
            echo "::error::The non-circularity lint PASSED a deliberately-circular file. The lint is broken."
            rm -f tests/ground_truth/test_deliberately_circular.py
            exit 1
          fi
          echo "Lint correctly rejected the circular file."
          rm -f tests/ground_truth/test_deliberately_circular.py

  workflow:
    name: nextflow workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: nf-core/setup-nextflow@v2

      - run: pip install -e .

      - name: Workflow compiles and reports its help
        run: nextflow run workflow/main.nf --help

      - name: A missing --pathogen fails cleanly
        run: |
          if nextflow run workflow/main.nf -profile conda_free > /dev/null 2>&1; then
            echo "::error::the workflow should refuse to run without --pathogen"
            exit 1
          fi
          echo "Workflow correctly refused to run without --pathogen."

  gate-invariant:
    name: D.H1 gate stays closed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .

      # The project's central invariant, checked on every commit. If the
      # FMDV gate ever opens, that must be a reviewed, deliberate change
      # accompanied by a real SUPPORTED verdict in the ledger — never
      # something that slips in unnoticed.
      - name: FMDV scoring must remain blocked
        run: |
          g4watch gate-status -p fmdv
          set +e
          g4watch score -p fmdv
          code=$?
          set -e
          if [ "$code" -ne 3 ]; then
            echo "::error::`g4watch score -p fmdv` exited $code, expected 3 (gate closed)."
            echo "::error::If the D.H1 verdict genuinely changed, update this job deliberately."
            exit 1
          fi
          echo "Gate correctly closed (exit 3)."
