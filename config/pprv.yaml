# G4-WATCH pathogen configuration — Peste des Petits Ruminants Virus
#
# NOT YET PROVISIONED. Phase 5 (multi-pathogen extension) scope. The
# fields the architecture already fixes for this pathogen are set below;
# the reference genome and corpus fields are deliberately null rather
# than guessed, and `provisioned: false` makes the config loader refuse
# to run this pathogen until a curator fills them in. Nothing here
# fabricates an accession or a coordinate.

pathogen: PPRV
display_name: "Peste des Petits Ruminants Virus"
genome_type: ssRNA_negative
taxonomy_id: 3052343
provisioned: false
provisioning_notes: |
  Required before this config can run:
    1. Choose and record a reference genome (the Nigeria 75/1 vaccine strain is the conventional reference) — set
       reference.accession and reference.fasta, and read the coding
       bounds from that record's own annotation rather than inferring
       them. This is a ~15.9 kb non-segmented negative-strand genome with six genes (N-P-M-F-H-L); record each gene span so stage0 can label loci by gene rather than by a single CDS.
    2. Fetch a corpus and accession list; populate corpus.*.
    3. Build the Atlas (`g4watch stage0`) and set atlas.version/atlas.path.

reference:
  accession: null
  fasta: null
  cds: null
  genome_length: null

corpus:
  metadata_tsv: null
  sequences_fasta: null
  lineage_field: lineage

qc:
  min_completeness_fraction: 0.90
  max_n_content_fraction: 0.05
  require_year_precision_date: true

alignment:
  tool: mafft
  args: "--auto --keeplength --addfragments"
  max_gapped_fraction: 0.50

recombination:
  # Section 11: MANDATORY but LOWER PRIORITY. Recombination is reported
  # for morbilliviruses but is not the dominant evolutionary mode; a
  # significant PHI result is recorded and flagged rather than
  # automatically rerouting the analysis to a non-tree-based estimate.
  enabled: true
  tier: standard
  alpha: 0.05

phylogenetics:
  tool: iqtree2
  model: GTR+F+I+G4
  bootstrap_replicates: 1000
  seed: 20250823
  outgroup: null
  ancestral_states: required
  timetree:
    tool: treetime
    clock_rate: null
    clock_filter_iqd: 3.0

g4_prediction:
  g4hunter:
    window: 25
    threshold: 1.2
  pattern_motif:
    enabled: true
  g4rna_screener:
    enabled: false
    reason: "upstream is Python 2-only with a pickled PyBrain classifier; see vendor/README.md"
  pqsfinder:
    enabled: false
    reason: "DNA-virus-scoped tool; not applicable to this RNA pathogen"
  concordance:
    min_overlap_fraction: 0.80
  flank: 100

control_regions:
  length_tolerance: 0.10
  gc_tolerance: 0.05
  pqs_overlap_score_threshold: 0.80
  exclusion_buffer: 50

atlas:
  version: null
  path: null

dh1_gate:
  alpha: 0.05
  ledger: data/atlases/testing_ledger.tsv

operational_mode: false
